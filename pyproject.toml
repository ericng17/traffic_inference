[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "traffic-pipeline"
version = "0.1.0"
description = "Durable Kafka/PostgreSQL and Ray vehicle counting batch pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.10.6", "PyYAML==6.0.2", "python-dotenv==1.0.1",
  "pyarrow==19.0.1", "Pillow==11.1.0", "numpy==2.1.3",
  "psycopg[binary]==3.2.6", "confluent-kafka==2.8.2", "duckdb==1.2.1",
  "huggingface-hub==0.29.3", "fsspec==2025.3.0", "s3fs==2025.3.0",
  "shapely==2.0.7",
]

[project.optional-dependencies]
ray = ["ray[default]==2.43.0"]
gpu = ["ray[default]==2.43.0", "torch==2.6.0", "torchvision==0.21.0", "ultralytics==8.3.253", "opencv-python==4.11.0.86"]
dev = ["pytest==8.3.5", "ruff==0.11.0"]

[project.scripts]
traffic-pipeline = "traffic_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL and Kafka", "ray: requires Ray actors"]

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_pipeline"]

